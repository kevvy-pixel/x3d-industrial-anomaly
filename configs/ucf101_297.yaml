project_root: runs/ucf101_297
seed: 42
classes:
  - Basketball
  - PlayingDaf
  - HorseRace
  - HorseRiding
  - PlayingDhol
data:
  video_root: data/ucf101_mirror
  split_root: data/ucfTrainTestlist
  manifest_root: runs/ucf101_297/data/manifests
  validation_fraction: 0.15
  test_fraction: 0.15
model:
  name: x3d_m
  input_frames: 16
  sampling_rate: 5
  crop_size: 224
  resize_short_train: [256, 320]
  resize_short_eval: 256
training:
  batch_size: 2
  accumulation_steps: 2
  num_workers: 2
  head_epochs: 5
  finetune_epochs: 10
  head_lr: 0.001
  finetune_lr: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.1
  mixed_precision: true
  early_stopping_patience: 6
evaluation:
  temporal_views: 1
